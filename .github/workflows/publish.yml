name: Synchronize and publish library

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: 'full imports the complete configured library; starter is a development fixture'
        type: choice
        options: [full, starter]
        default: full
      target:
        description: 'R2 serves the full corpus; Pages has smaller hosting quotas'
        type: choice
        options: [cloudflare-r2, github-pages]
        default: cloudflare-r2

permissions:
  contents: read

# An interrupted upload could leave a mixed version. Queue publications instead.
concurrency:
  group: production-library
  cancel-in-progress: false

env:
  LIBRARY_PROFILE: ${{ inputs.profile || 'full' }}
  DEPLOY_TARGET: ${{ inputs.target || 'cloudflare-r2' }}
  SOURCE_CATALOG: .cache/library/catalog.json
  SITE_URL: ${{ vars.SITE_URL || 'https://nhlocal.github.io' }}
  BASE_PATH: ${{ vars.BASE_PATH || (inputs.target == 'github-pages' && '/otzaria-web/') || '/' }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build_required: ${{ steps.check.outputs.build_required }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check whether the scheduled publication changed
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT_NAME" = 'schedule' ] && [ -n "$PUBLIC_SITE_URL" ]; then
            python3 scripts/check_published.py
          else
            echo 'build_required=true' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: preflight
    if: needs.preflight.outputs.build_required == 'true'
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    permissions:
      contents: read
      pages: read
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: npm ci
      - name: Prepare full-library build tools and disk space
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zstd
          python3 -m pip install --disable-pip-version-check -r scripts/requirements.txt
          if [ "${{ runner.environment }}" = 'github-hosted' ]; then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          fi
          df -h .
      - run: npm test
      - name: Restore upstream cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/upstream/archives
          key: upstream-v1-${{ runner.os }}-${{ env.LIBRARY_PROFILE }}-${{ github.run_id }}
          restore-keys: |
            upstream-v1-${{ runner.os }}-${{ env.LIBRARY_PROFILE }}-
      - name: Synchronize the requested complete profile
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run sync
      - name: Release expanded database on the disposable runner
        if: runner.environment == 'github-hosted'
        run: rm -rf .cache/upstream/databases
      - name: Build complete HTML and static data
        run: node scripts/build.mjs
      - name: Release imported snapshots after successful rendering
        if: runner.environment == 'github-hosted'
        run: rm -rf .cache/library .cache/companions
      - name: Index, enforce budgets and verify
        run: |
          node scripts/index-search.mjs
          node scripts/check-size.mjs
          npm run verify
      - name: Keep build inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-inventory-${{ github.run_id }}
          path: |
            dist/build-manifest.json
            dist/search-manifest.json
            .cache/build-size.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
      - name: Keep optional complete static artifact
        if: vars.KEEP_FULL_ARTIFACT == 'true' || env.LIBRARY_PROFILE == 'starter'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: static-site-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true
      - name: Detect configured R2 destination
        if: env.DEPLOY_TARGET == 'cloudflare-r2'
        id: r2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ] && [ -n "$R2_ACCOUNT_ID" ] && [ -n "$R2_BUCKET" ] && [ -n "$PUBLIC_SITE_URL" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Build verified. R2 publication skipped: configure the destination and credentials documented in docs/DEPLOYMENT.md.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install the static object uploader
        if: steps.r2.outputs.enabled == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y rclone
      - name: Publish changed objects to the dedicated R2 bucket
        if: steps.r2.outputs.enabled == 'true'
        env:
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PREFIX: ${{ vars.R2_PREFIX }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: 'true'
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bash scripts/deploy-r2.sh
      - name: Detect GitHub Pages configuration
        if: env.DEPLOY_TARGET == 'github-pages'
        id: pages
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            try {
              const { data } = await github.rest.repos.getPages(context.repo);
              const enabled = data.build_type === 'workflow';
              core.setOutput('enabled', String(enabled));
              if (!enabled) await core.summary.addRaw('Site verified. Select GitHub Actions in Settings > Pages to enable publication.').write();
            } catch (error) {
              if (![403, 404].includes(error.status)) throw error;
              core.setOutput('enabled', 'false');
              await core.summary.addRaw('Site verified. Pages is not enabled or is not accessible to this token; publication skipped.').write();
            }
      - name: Package GitHub Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist/

  deploy-pages:
    if: needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
